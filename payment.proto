syntax = "proto3";

package payment;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Asylann/ap2_generated;ap2_generated";

service PaymentService {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
  // Unary RPC for filtered payments [User Input]
  rpc ListPayments (ListPaymentsRequest) returns (ListPaymentsResponse);
}

message PaymentRequest {
  string order_id = 1;
  int64 amount = 2; // in cents
  string currency = 3;
}

message PaymentResponse {
  string payment_id = 1;
  string status = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListPaymentsRequest {
  int64 min_amount = 1; // 0 = no limit
  int64 max_amount = 2; // 0 = no limit
}

message ListPaymentsResponse {
  repeated PaymentResponse payments = 1;
}